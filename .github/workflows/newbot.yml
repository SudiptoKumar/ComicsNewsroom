name: ComicsNewsroom

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"

# Never allow two newsroom publishers to run against the same state at once.
# Overlapping runs can otherwise read identical state and both publish the same story.
concurrency:
  group: comics-newsroom-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Self-test
        env:
          EXA_API_KEY: dummy
          CEREBRAS_API_KEY: dummy
          TELEGRAM_BOT_TOKEN: dummy
        run: python main.py --self-test
      - name: Publish
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL: "@ComicsNewsroom"
          NEWS_MODE: "update"
          CEREBRAS_MODEL: "gpt-oss-120b"
        run: python main.py
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain news_state.json posted_urls.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news_state.json posted_urls.txt
            git commit -m "chore: update comics newsroom state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
